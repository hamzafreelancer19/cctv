services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinelvision
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel -d sentinelvision"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: docker.io/pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build: ./backend
    image: sentinelvision-backend:local
    environment:
      SECRET_KEY: dev-insecure-change-me-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DATABASE_URL: postgres://sentinel:sentinel@db:5432/sentinelvision
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:3000,http://frontend
      EDGE_API_KEY: edge-dev-api-key-change-in-production
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      EVIDENCE_STORAGE_BACKEND: minio
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_STORAGE_BUCKET_NAME: sentinelvision-evidence
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media
      - model_cache:/app/model_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/ready/')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 40s
    restart: unless-stopped

  celery_worker:
    image: sentinelvision-backend:local
    pull_policy: never
    command: celery -A config worker -l info -Q default,notifications,recordings,siem
    environment:
      SECRET_KEY: dev-insecure-change-me-in-production
      DEBUG: "True"
      DATABASE_URL: postgres://sentinel:sentinel@db:5432/sentinelvision
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
      EVIDENCE_STORAGE_BACKEND: minio
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_STORAGE_BUCKET_NAME: sentinelvision-evidence
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
    volumes:
      - media_data:/app/media
      - model_cache:/app/model_cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped

  celery_beat:
    image: sentinelvision-backend:local
    pull_policy: never
    command: celery -A config beat -l info
    environment:
      SECRET_KEY: dev-insecure-change-me-in-production
      DEBUG: "True"
      DATABASE_URL: postgres://sentinel:sentinel@db:5432/sentinelvision
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_TASK_ALWAYS_EAGER: "False"
    depends_on:
      redis:
        condition: service_healthy
      celery_worker:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  edge:
    build: ./edge
    environment:
      API_BASE_URL: http://backend:8000/api/v1
      EDGE_API_KEY: edge-dev-api-key-change-in-production
      HEARTBEAT_INTERVAL: 30
      SIMULATION_INTERVAL: 15
      EDGE_VERSION: 0.2.0-m2
      EDGE_MODE: auto
      DETECTION_BACKEND: simulated
      TARGET_INFER_FPS: 5
      EVENT_COOLDOWN_SEC: 15
      LOITERING_SECONDS: 8
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  media_data:
  model_cache:
