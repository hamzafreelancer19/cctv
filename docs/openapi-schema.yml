      operationId: v1_alert_rules_list
      description: Scope queryset to organizations the user belongs to.
      parameters:
      - in: query
        name: event_type
        schema:
          type: string
          enum:
          - activity
          - attendance
          - face_recognized
          - fire_smoke
          - intrusion
          - person_detected
          - unknown_person
          - visitor
          - weapon
        description: |-
          * `person_detected` - Person Detected
          * `face_recognized` - Face Recognized
          * `unknown_person` - Unknown Person
          * `intrusion` - Intrusion
          * `activity` - Activity
          * `fire_smoke` - Fire/Smoke
          * `weapon` - Weapon
          * `attendance` - Attendance
          * `visitor` - Visitor
      - in: query
        name: is_active
        schema:
          type: boolean
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - v1
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlertRuleList'
          description: ''
    post:
      operationId: v1_alert_rules_create
      description: Scope queryset to organizations the user belongs to.
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlertRule'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlertRule'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlertRule'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
